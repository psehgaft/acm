---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-bootstrap-appset
  namespace: openshift-gitops
spec:
  generators:
    - matrix:
        generators:
          - clusterDecisionResource:
              configMapRef: acm-placement
              labelSelector:
                matchLabels:
                  cluster.open-cluster-management.io/placement: lab-clusterset
              requeueAfterSeconds: 3600
          - git:
              repoURL: https://github.com/psehgaft/acm.git
              revision: "main"
              directories:
                - path: kustomize/cluster-bootstrap/*
              files:
                - path: kustomize/cluster-bootstrap/**/config.json
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: type
              operator: In
              values:
                - operators
        - matchExpressions:
            - key: type
              operator: In
              values:
                - operand
        - matchExpressions:
            - key: type
              operator: In
              values:
                - configuration
  template:
    metadata:
      name: '{{name}}-{{path.basename}}'
    spec:
      destination:
        server: "{{server}}"
      project: default
      syncPolicy:
        automated:
          selfHeal: true
      source:
        path: "{{path}}"
        repoURL: "https://github.com/psehgaft/acm.git"
        targetRevision: "main"
